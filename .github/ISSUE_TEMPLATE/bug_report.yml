name: Bug report
description: Something doesn't work or looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Screenshots help a lot.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: From `winver`, e.g. "Windows 11 24H2 (26100.2605)"
    validations:
      required: true
  - type: input
    id: perch
    attributes:
      label: perch version
      description: The release you installed, or the commit you built.
  - type: dropdown
    id: scaling
    attributes:
      label: Display scaling
      options: ["100%", "125%", "150%", "175%", "200%", "Other / several monitors"]
  - type: checkboxes
    id: setup
    attributes:
      label: Setup
      options:
        - label: Taskbar background clearing is on
        - label: Claude Code hooks are connected
        - label: I run TranslucentTB, Windhawk or another taskbar tool
  - type: textarea
    id: log
    attributes:
      label: perch.log
      description: Anything relevant from `%TEMP%\perch.log`.
      render: text
